# T011's Swift half. The ceiling that matters is the constitution's
# cyclomatic-complexity limit of 10, matching `complexity: ['error', 10]`
# in api/eslint.config.js — the same rule on both sides of the product.
#
# First run in anger was CI on PR #1 (2026-09-22), which found 40
# violations. Note that the `ios` job runs `--strict`, so a `warning`
# severity below still fails the build — the tiers express how bad a thing
# is, not whether it blocks.
included:
  - fyndra/fyndra
  - FyndraCore/Sources
  - fyndra/fyndraTests
  - fyndra/fyndraUITests

excluded:
  - FyndraCore/.build

cyclomatic_complexity:
  warning: 10
  error: 10

# SwiftUI view bodies are legitimately long and legitimately nested; the
# limits below are relaxed for them rather than suppressed everywhere.
type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

line_length:
  warning: 140
  error: 200
  ignores_comments: true

identifier_name:
  # The three-character minimum is right in general and wrong for these.
  # Renaming any of them would make the code worse, not clearer:
  #   xs/sm/md/lg/xl  the spacing scale in DesignTokens — a conventional
  #                   ramp that reads as one unit at the call site
  #   en              AppLanguage's case, which IS the API's wire value
  #   cv              the product's core noun; "curriculumVitae" is nobody's
  #                   name for the thing, and the API calls it cv throughout
  excluded: [id, x, n, xs, sm, md, lg, xl, en, cv]

disabled_rules:
  # Views read better with trailing-closure-heavy call chains than the
  # rule's preferred form.
  - multiple_closures_with_trailing_closure
  - todo

opt_in_rules:
  - empty_count
  - force_unwrapping
  - explicit_init

force_unwrapping:
  severity: warning
