services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fyndra
      POSTGRES_PASSWORD: fyndra
      POSTGRES_DB: fyndra
    ports:
      - '5432:5432'
    volumes:
      - fyndra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fyndra']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fyndra:fyndra@postgres:5432/fyndra
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fyndra:fyndra@postgres:5432/fyndra
    command: ['npm', 'run', 'start:worker']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fyndra_pgdata:
